[project]
name = "genes-jpg"
version = "0.1.0"
description = "Genome <-> species image datasets and models"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "polars>=1.0",
    "duckdb>=1.1",
    "huggingface_hub>=0.25",
    "requests>=2.31",
    "pillow>=10",
    "pydantic>=2.8",
    "tqdm>=4.66",
    "biopython>=1.84",
    "typer>=0.12",
    "jsonschema>=4.26.0",
]

[project.optional-dependencies]
analysis = ["scipy>=1.14", "statsmodels>=0.14", "matplotlib>=3.8"]
web = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.20", "pysam>=0.23"]
# DNA -> image model (genesjpg): `uv sync --extra model`
model = [
    "torch",
    "torchvision",
    "transformers>=4.48,<5",
    "open_clip_torch",
    "diffusers",
    "accelerate",
    "safetensors",
    "remotezip",
    "h5py>=3.11",
]

[project.scripts]
genes-datasets = "datasets.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datasets", "genesjpg", "longevity"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["network: tests that access the network (NCBI, image hosts)"]
