[project]
name = "genes-jpg"
version = "0.1.0"
description = "Genome <-> species image datasets and models"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "polars>=1.0",
    "duckdb>=1.1",
    "huggingface_hub>=0.25",
    "requests>=2.31",
    "pillow>=10",
    "pydantic>=2.8",
    "tqdm>=4.66",
    "biopython>=1.84",
    "typer>=0.12",
    "jsonschema>=4.26.0",
]

[project.scripts]
genes-datasets = "datasets.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datasets"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that access the network (NCBI, image hosts)"]
